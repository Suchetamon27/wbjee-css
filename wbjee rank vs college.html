<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WBJEE 2025 Rank Predictor</title>
  <style>
    :root {
      --primary: #6200ea;
      --secondary: #03dac6;
      --background: #f3f3f3;
      --text: #212121;
      --card-bg: white;
      --accent: #ff0266;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--background);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }
    h1 { color: var(--primary); margin-bottom: 0.5rem; }
    p { margin-bottom: 2rem; color: #444; }
    .card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    button {
      margin-top: 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.9rem;
      width: 100%;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { background: var(--accent); }
    .result {
      margin-top: 2rem;
      background: var(--secondary);
      padding: 1.5rem;
      border-radius: 12px;
      color: black;
      font-weight: bold;
      text-align: center;
    }
    #downloadBtn {
      margin-top: 1rem;
      background: #00796b;
    }
  </style>
</head>
<body>
  <h1>WBJEE 2025 Rank Predictor</h1>
  <p>Enter your marks and category to predict your GMR and Category Rank</p>

  <div class="card">
    <label for="marks">Marks Scored (out of 200)</label>
    <input type="number" id="marks" placeholder="e.g., 130" min="0" max="200"/>

    <label for="category">Category</label>
    <select id="category">
      <option value="GEN">General (GEN)</option>
      <option value="SC">Scheduled Caste (SC)</option>
      <option value="ST">Scheduled Tribe (ST)</option>
      <option value="OBC">OBC</option>
      <option value="TFW">TFW</option>
    </select>

    <button onclick="predictRank()">Predict Rank</button>
    <button id="downloadBtn" style="display:none;" onclick="downloadPDF()">Download PDF</button>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <!-- Load jsPDF and html2canvas libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    function getCollegeSuggestions(category, catRank) {
      const cutoffs = [
        { name: "Jadavpur University (CSE)", min: 22, max: 89, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (IT)", min: 126, max: 293, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (ETE)", min: 128, max: 280, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (EE)", min: 301, max: 504, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (ME)", min: 511, max: 761, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (CHEM E)", min: 442, max: 639, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (CIVIL E)", min: 986, max: 1594, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (FTE)", min: 1546, max: 3125, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (PROD E)", min: 880, max: 1151, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (POWER E)", min: 648, max: 1073, categories: ["GEN","OBC","SC","ST","TFW"] },
        { name: "Jadavpur University (IEE)", min: 303, max: 412, categories: ["GEN","OBC","SC","ST","TFW"] },
        
        { name: "Kalyani Govt. Engg. College (CSE)", min: 721, max: 1432, categories: ["GEN","OBC","SC","ST"] },
        { name: "Kalyani Govt. Engg. College (IT)", min: 1470, max: 1901, categories: ["GEN","OBC","SC","ST"] },
        { name: "Kalyani Govt. Engg. College (ECE)", min: 1117, max: 2210, categories: ["GEN","OBC","SC","ST"] },
        { name: "Kalyani Govt. Engg. College (EE)", min: 1921, max: 2982, categories: ["GEN","OBC","SC","ST"] },  
        { name: "Kalyani Govt. Engg. College (ME)", min: 1954, max: 3849, categories: ["GEN","OBC","SC","ST"] },

        { name: "Jalpaiguri Govt. Engg. College (CSE)", min: 316, max: 1747, categories: ["GEN","OBC","SC","ST"] },
        { name: "Jalpaiguri Govt. Engg. College (IT)", min: 1870, max: 2335, categories: ["GEN","OBC","SC","ST"] },
        { name: "Jalpaiguri Govt. Engg. College (ECE)", min: 1565, max: 2724, categories: ["GEN","OBC","SC","ST"] },
        { name: "Jalpaiguri Govt. Engg. College (EE)", min: 1857, max: 3446, categories: ["GEN","OBC","SC","ST"] },  
        { name: "Jalpaiguri Govt. Engg. College (ME)", min: 2856, max: 4455, categories: ["GEN","OBC","SC","ST"] },
        { name: "Jalpaiguri Govt. Engg. College (CIVIL E)", min: 2337, max: 5839, categories: ["GEN","OBC","SC","ST"] },

        { name: "University of Calcutta (CSE)", min: 510, max: 830, categories: ["GEN","OBC","SC","ST"] },
        { name: "Universiy of Calcutta (IT)", min: 855, max: 1195, categories: ["GEN","OBC","SC","ST"] },
        { name: "University of Calcutta (ECE)", min: 1183, max: 1392, categories: ["GEN","OBC","SC","ST"] },  
        { name: "University of Calcutta (EE)", min: 1408, max: 1634, categories: ["GEN","OBC","SC","ST"] },
        { name: "University of Calcutta (CHEM E)", min: 1597, max: 2282, categories: ["GEN","OBC","SC","ST"] },  
        { name: "University of Calcutta (CIVIL E)", min: 1954, max: 3849, categories: ["GEN","OBC","SC","ST"] },
        { name: "University of Calcutta (IEE)", min: 1334, max: 1918, categories: ["GEN","OBC","SC","ST"] }, 
        
        { name: "Heritage Institute of Technology (CSE)", min: 782, max: 3585, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (CSE CYBERSECURITY)", min: 4939, max:6224, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (CSE AIML)", min: 1039, max: 4487, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (CSBS)", min: 5481, max: 7956, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (EE)", min: 6953, max: 12548, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (ME)", min: 8670, max: 22061, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (ECE)", min: 2243, max: 8851, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (IT)", min: 3145, max: 5044, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (CHEM E)", min: 3731, max: 22836, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (CIVIL E)", min: 5687, max: 27759, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (BIOTECH E)", min: 4978, max: 18791, categories: ["GEN","OBC","SC","ST"] },
        { name: "Heritage Institute of Technology (CS DATASCIENCE)", min: 2753, max: 5361, categories: ["GEN","OBC","SC","ST"] },
       
{ name: "Techno Main SaltlaKe (CSE)", min: 3756, max: 18777, categories: ["GEN","OBC","SC","ST"] }, 
{ name: "Techno Main SaltlaKe (CSE AIML)", min: 5966, max: 20190, categories: ["GEN","OBC","SC","ST"] },
{ name: "Techno Main SaltlaKe (CSE DATASCIENCE)", min: 2753, max: 5361, categories: ["GEN","OBC","SC","ST"] },
{ name: "Techno Main SaltlaKe (CSE IOT)", min: 5687, max: 27759, categories: ["GEN","OBC","SC","ST"] },
{ name: "Techno Main SaltlaKe (IT)", min: 3145, max: 5044, categories: ["GEN","OBC","SC","ST"] },
{ name: "Techno Main SaltlaKe (ECE)", min: 7042, max: 27068, categories: ["GEN","OBC","SC","ST"] },
{ name: "Techno Main SaltlaKe (EE)", min: 18578, max: 52524, categories: ["GEN","OBC","SC","ST"] },
{ name: "Techno Main SaltlaKe (ME)", min: 19682, max: 97702, categories: ["GEN","OBC","SC","ST"] },
{ name: "Techno Main SaltlaKe (CIVIL E)", min: 11127, max: 108510, categories: ["GEN","OBC","SC","ST"] },
{ name: "Techno Main SaltlaKe (CSBS)", min: 19975, max: 40144, categories: ["GEN","OBC","SC","ST"] },
{ name: "Techno Main SaltlaKe (BIOTECH E)", min: 9280, max: 34129, categories: ["GEN","OBC","SC","ST"] },
 ];

      let matches = cutoffs.filter(col => col.categories.includes(category) && catRank >= col.min && catRank <= col.max);
      return matches.length ? matches : [{ name: "No clear match — consider lower-tier colleges or upcoming rounds." }];
    }

    function predictRank() {
      const marks = parseFloat(document.getElementById("marks").value);
      const category = document.getElementById("category").value;
      const resultBox = document.getElementById("result");
      const downloadBtn = document.getElementById("downloadBtn");

      if (isNaN(marks) || marks < 0 || marks > 200) {
        resultBox.style.display = "block";
        resultBox.innerHTML = "❌ Please enter valid marks between 0 and 200.";
        downloadBtn.style.display = "none";
        return;
      }

      const gmr = Math.round(18600000000 / Math.pow(marks + 1, 3.875));
      const catFactor = { GEN: 1, SC: 0.085, ST: 0.026, OBC: 0.14, TFW: 0.05 };
      const categoryRank = Math.round(gmr * catFactor[category]);
      const colleges = getCollegeSuggestions(category, categoryRank);

      let html = `🎯 <strong>Predicted GMR:</strong> ${gmr.toLocaleString()}<br>`;
      html += `🏷️ <strong>${category} Rank:</strong> ${categoryRank.toLocaleString()}<br><br>`;
      html += "<strong>🧑‍🎓 Likely Colleges (2024 cutoff):</strong><ul>";
      colleges.forEach(col => html += `<li>${col.name}</li>`);
      html += "</ul>";

      resultBox.style.display = "block";
      resultBox.innerHTML = html;
      downloadBtn.style.display = "inline-block";
    }

    async function downloadPDF() {
      const resultBox = document.getElementById("result");
      const canvas = await html2canvas(resultBox);
      const imgData = canvas.toDataURL("image/png");
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      const width = pdf.internal.pageSize.getWidth();
      const height = (canvas.height * width) / canvas.width;
      pdf.addImage(imgData, "PNG", 10, 10, width - 20, height);
      pdf.save("wbjee-predicted-rank.pdf");
    }
  </script>
</body>
</html>
